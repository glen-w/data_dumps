[project]
name = "data-dumps"
version = "0.1.0"
description = "Ingest and explore personal GDPR data exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "marimo>=0.9.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "pytz>=2024.1",
]

[project.scripts]
ingest = "data_dumps.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_dumps"]

[tool.uv]
package = true
