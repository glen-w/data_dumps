# Personal GDPR dumps: code in the image, data on the bind mount.
# ONE process at a time on warehouse/catalog.duckdb — see docs/WAREHOUSE.md.
# Stop `app` before ingest or enrich-musicbrainz.

services:
  app:
    build: .
    ports:
      - "127.0.0.1:2718:2718"
    volumes:
      - ${HOME}/Documents/data_dumps_raw:/data:rw
      # Read-only. Tools reads message bodies for addresses only; source tables still omit them.
      - ${HOME}/Library/Thunderbird/Profiles:/thunderbird:ro
    environment:
      DATA_DUMPS_ROOT: /data
      DATA_DUMPS_TB_PROFILE: /thunderbird
      DATA_DUMPS_LLM_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
