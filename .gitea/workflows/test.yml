name: test
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run black --check src tests
      - run: uv run mypy src
      - run: uv run python -m marimo check notebooks/explorer.py notebooks/spotify.py notebooks/telegram.py notebooks/linkedin.py notebooks/twitter.py
